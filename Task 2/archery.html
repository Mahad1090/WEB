<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archery Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #87CEEB, #228B22);
            min-height: 100vh;
            overflow: hidden;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
        }

        .score-display, .timer-display {
            font-size: 24px;
            font-weight: bold;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 70px);
            overflow: hidden;
        }

       
        .target-area {
            position: absolute;
            top: 50px;
            right: 50px;
            width: 500px;
            height: 400px;
            border: 3px dashed rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

       
        .target {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: crosshair;
            transition: width 0.3s, height 0.3s;
            background: 
                radial-gradient(circle, 
                    #FFD700 0%, #FFD700 10%,
                    #FF0000 10%, #FF0000 25%,
                    white 25%, white 40%,
                    #FF0000 40%, #FF0000 55%,
                    white 55%, white 70%,
                    #FF0000 70%, #FF0000 85%,
                    white 85%, white 100%
                );
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        
        .bow {
            position: absolute;
            bottom: 100px;
            left: 80px;
            width: 20px;
            height: 120px;
            background: #8B4513;
            border-radius: 50% 50% 50% 50% / 10% 10% 10% 10%;
            transform: rotate(-10deg);
            border: 3px solid #5D3A1A;
        }

        .bow::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 120px;
            background: #333;
        }

        .bow::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -15px;
            width: 50px;
            height: 140px;
            border: 4px solid transparent;
            border-left: 4px solid #8B4513;
            border-radius: 50%;
        }

        
        .arrow {
            position: absolute;
            bottom: 140px;
            left: 100px;
            width: 60px;
            height: 6px;
            background: linear-gradient(to right, #8B4513, #D2691E);
            border-radius: 2px;
            transition: none;
        }

        .arrow::before {
            content: '';
            position: absolute;
            right: -15px;
            top: -5px;
            width: 0;
            height: 0;
            border-left: 20px solid #555;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
        }

        .arrow::after {
            content: '';
            position: absolute;
            left: -10px;
            top: -7px;
            width: 15px;
            height: 20px;
            background: linear-gradient(135deg, #FF6B6B 25%, transparent 25%),
                        linear-gradient(225deg, #FF6B6B 25%, transparent 25%);
            clip-path: polygon(100% 50%, 0 0, 0 100%);
        }

        .arrow.flying {
            transition: all 0.4s linear;
        }

       
        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .game-over-box {
            background: white;
            padding: 40px 60px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .game-over-box h2 {
            font-size: 36px;
            color: #333;
            margin-bottom: 15px;
        }

        .final-score {
            font-size: 28px;
            color: #4CAF50;
            margin-bottom: 25px;
        }

        .restart-btn {
            padding: 12px 40px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .restart-btn:hover {
            background: #45a049;
        }

        /* Instructions */
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
        }

       
        .difficulty-display {
            font-size: 18px;
            padding: 5px 15px;
            background: #FF9800;
            border-radius: 5px;
        }

        /* Hit Effect */
        .hit-effect {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.8), transparent);
            animation: hitPulse 0.5s ease-out forwards;
            pointer-events: none;
        }

        @keyframes hitPulse {
            0% {
                transform: scale(0.5);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="game-header">
        <div class="score-display">Score: <span id="scoreValue">0</span></div>
        <div class="difficulty-display">Level: <span id="levelValue">1</span></div>
        <div class="timer-display">Time: <span id="timerValue">60</span>s</div>
    </div>

    <div class="game-container" id="gameContainer">
        <div class="target-area" id="targetArea">
            <div class="target" id="target"></div>
        </div>
        <div class="bow" id="bow"></div>
        <div class="arrow" id="arrow"></div>
        <div class="instructions">Click anywhere to shoot! Aim where the target will be!</div>
    </div>

    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-box">
            <h2>Game Over!</h2>
            <div class="final-score">Your Score: <span id="finalScore">0</span></div>
            <button class="restart-btn" id="restartBtn">Play Again</button>
        </div>
    </div>

    <script>
        // ==========================================
        // DOM Element Selection
        // ==========================================
        const scoreDisplay = document.getElementById('scoreValue');
        const timerDisplay = document.getElementById('timerValue');
        const levelDisplay = document.getElementById('levelValue');
        const gameContainer = document.getElementById('gameContainer');
        const targetArea = document.getElementById('targetArea');
        const target = document.getElementById('target');
        const arrow = document.getElementById('arrow');
        const bow = document.getElementById('bow');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreDisplay = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        // ==========================================
        // Game State Variables
        // ==========================================
        let score = 0;
        let timeLeft = 60;
        let gameOver = false;
        let level = 1;
        let targetSpeed = 2;
        let targetSize = 80;
        let isArrowFlying = false;
        let timerInterval = null;
        let targetMoveInterval = null;

        // Target position and direction
        let targetX = 100;
        let targetY = 100;
        let targetDirX = 1;
        let targetDirY = 1;

        // Arrow initial position
        const arrowStartX = 100;
        const arrowStartY = window.innerHeight - 210;

        // ==========================================
        // Function: Update Score Display
        // ==========================================
        function updateScore(points) {
            score = score + points;
            scoreDisplay.textContent = score;
            
            // Check if difficulty should increase
            checkDifficulty();
        }

        // ==========================================
        // Function: Start Timer Countdown
        // ==========================================
        function startTimer() {
            timerInterval = setInterval(function() {
                if (timeLeft > 0 && !gameOver) {
                    timeLeft = timeLeft - 1;
                    timerDisplay.textContent = timeLeft;
                    
                    // Change timer color when low
                    if (timeLeft <= 10) {
                        timerDisplay.style.color = '#FF5722';
                    }
                } else {
                    endGame();
                }
            }, 1000);
        }

        // ==========================================
        // Function: Move Target
        // ==========================================
        function moveTarget() {
            if (gameOver) {
                return;
            }

            // Get target area boundaries
            const areaWidth = targetArea.offsetWidth - targetSize;
            const areaHeight = targetArea.offsetHeight - targetSize;

            // Update target position
            targetX = targetX + (targetSpeed * targetDirX);
            targetY = targetY + (targetSpeed * targetDirY);

            // Bounce off walls
            if (targetX <= 0 || targetX >= areaWidth) {
                targetDirX = targetDirX * -1;
                targetX = Math.max(0, Math.min(targetX, areaWidth));
            }
            if (targetY <= 0 || targetY >= areaHeight) {
                targetDirY = targetDirY * -1;
                targetY = Math.max(0, Math.min(targetY, areaHeight));
            }

            // Apply position to target element
            target.style.left = targetX + 'px';
            target.style.top = targetY + 'px';
        }

        // ==========================================
        // Function: Increase Difficulty
        // ==========================================
        function increaseDifficulty() {
            level = level + 1;
            levelDisplay.textContent = level;

            // Increase target speed
            targetSpeed = targetSpeed + 0.5;

            // Decrease target size (minimum 40px)
            if (targetSize > 40) {
                targetSize = targetSize - 8;
                target.style.width = targetSize + 'px';
                target.style.height = targetSize + 'px';
            }

            // Change target color based on level
            updateTargetColor();
        }

        // ==========================================
        // Function: Check if Difficulty Should Increase
        // ==========================================
        function checkDifficulty() {
            // Increase difficulty every 3 points
            const newLevel = Math.floor(score / 3) + 1;
            if (newLevel > level) {
                increaseDifficulty();
            }
        }

        // ==========================================
        // Function: Update Target Color
        // ==========================================
        function updateTargetColor() {
            const colors = ['#FF0000', '#FF5722', '#9C27B0', '#3F51B5', '#009688'];
            const colorIndex = (level - 1) % colors.length;
            const mainColor = colors[colorIndex];

            target.style.background = 'radial-gradient(circle, ' +
                '#FFD700 0%, #FFD700 10%, ' +
                mainColor + ' 10%, ' + mainColor + ' 25%, ' +
                'white 25%, white 40%, ' +
                mainColor + ' 40%, ' + mainColor + ' 55%, ' +
                'white 55%, white 70%, ' +
                mainColor + ' 70%, ' + mainColor + ' 85%, ' +
                'white 85%, white 100%)';
        }

        // ==========================================
        // Function: Shoot Arrow
        // ==========================================
        function shootArrow(aimX, aimY) {
            if (isArrowFlying || gameOver) {
                return;
            }

            isArrowFlying = true;

            // Add flying class for transition
            arrow.classList.add('flying');

            // Move arrow to clicked position
            arrow.style.left = aimX + 'px';
            arrow.style.bottom = 'auto';
            arrow.style.top = aimY + 'px';

            // Check for hit after arrow reaches destination
            setTimeout(function() {
                checkHit(aimX, aimY);
            }, 400);
        }

        // ==========================================
        // Function: Check if Arrow Hit Target
        // ==========================================
        function checkHit(arrowX, arrowY) {
            // Get current target position
            const targetRect = target.getBoundingClientRect();
            const containerRect = gameContainer.getBoundingClientRect();

            const currentTargetX = targetRect.left - containerRect.left;
            const currentTargetY = targetRect.top - containerRect.top;

            // Check collision
            const hitX = arrowX >= currentTargetX && arrowX <= currentTargetX + targetSize;
            const hitY = arrowY >= currentTargetY && arrowY <= currentTargetY + targetSize;

            if (hitX && hitY) {
                // Target was hit!
                updateScore(1);
                showHitEffect(arrowX, arrowY);
            }

            // Reset arrow position after a short delay
            setTimeout(function() {
                resetArrow();
            }, 200);
        }

        // ==========================================
        // Function: Show Hit Effect
        // ==========================================
        function showHitEffect(x, y) {
            const effect = document.createElement('div');
            effect.className = 'hit-effect';
            effect.style.left = (x - 50) + 'px';
            effect.style.top = (y - 50) + 'px';
            gameContainer.appendChild(effect);

            // Remove effect after animation
            setTimeout(function() {
                effect.remove();
            }, 500);
        }

        // ==========================================
        // Function: Reset Arrow Position
        // ==========================================
        function resetArrow() {
            arrow.classList.remove('flying');
            arrow.style.left = arrowStartX + 'px';
            arrow.style.top = 'auto';
            arrow.style.bottom = '140px';
            isArrowFlying = false;
        }

        // ==========================================
        // Function: End Game
        // ==========================================
        function endGame() {
            gameOver = true;

            // Stop all intervals
            clearInterval(timerInterval);
            clearInterval(targetMoveInterval);

            // Show game over screen
            finalScoreDisplay.textContent = score;
            gameOverOverlay.style.display = 'flex';
        }

        // ==========================================
        // Function: Reset Game
        // ==========================================
        function resetGame() {
            // Reset state variables
            score = 0;
            timeLeft = 60;
            gameOver = false;
            level = 1;
            targetSpeed = 2;
            targetSize = 80;
            isArrowFlying = false;

            // Reset target position
            targetX = 100;
            targetY = 100;
            targetDirX = 1;
            targetDirY = 1;

            // Reset displays
            scoreDisplay.textContent = '0';
            timerDisplay.textContent = '60';
            timerDisplay.style.color = 'white';
            levelDisplay.textContent = '1';

            // Reset target size and color
            target.style.width = targetSize + 'px';
            target.style.height = targetSize + 'px';
            updateTargetColor();

            // Reset arrow position
            resetArrow();

            // Hide game over overlay
            gameOverOverlay.style.display = 'none';

            // Start game again
            startGame();
        }

        // ==========================================
        // Function: Start Game
        // ==========================================
        function startGame() {
            // Start the timer
            startTimer();

            // Start moving the target
            targetMoveInterval = setInterval(function() {
                moveTarget();
            }, 20);
        }

        // ==========================================
        // Event Listeners
        // ==========================================

        // Click event - Click to aim and shoot
        gameContainer.addEventListener('click', function(event) {
            // Prevent shooting when clicking restart button
            if (event.target === restartBtn) {
                return;
            }
            
            // Get click position relative to game container
            const containerRect = gameContainer.getBoundingClientRect();
            const aimX = event.clientX - containerRect.left;
            const aimY = event.clientY - containerRect.top;
            
            shootArrow(aimX, aimY);
        });

        // Restart button click
        restartBtn.addEventListener('click', function(event) {
            event.stopPropagation();
            resetGame();
        });

        // ==========================================
        // Initialize Game
        // ==========================================
        function initGame() {
            // Set initial arrow position
            arrow.style.left = arrowStartX + 'px';
            arrow.style.bottom = '140px';

            // Set initial target position
            target.style.left = targetX + 'px';
            target.style.top = targetY + 'px';

            // Start the game
            startGame();
        }

        // Start when page loads
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
