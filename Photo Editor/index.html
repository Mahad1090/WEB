<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Editor | Roll No. 0537</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== Main Application Container ===== -->
    <div class="container">

        <!-- ===== LEFT PANEL: Editor Controls ===== -->
        <div class="editor-panel">

            <!-- Filter Buttons Section -->
            <div class="filter-section">
                <label class="section-title">Filters</label>
                <div class="filter-buttons">
                    <!-- 6 filter buttons in a 2-column grid -->
                    <button id="brightness" class="filter-btn active">Brightness</button>
                    <button id="saturation" class="filter-btn">Saturation</button>
                    <button id="inversion" class="filter-btn">Inversion</button>
                    <button id="grayscale" class="filter-btn">Grayscale</button>
                    <button id="sepia" class="filter-btn">Sepia</button>
                    <button id="blur" class="filter-btn">Blur</button>
                </div>
            </div>

            <!-- Active Filter Slider -->
            <div class="slider-wrapper">
                <div class="slider-header">
                    <span id="filter-name" class="slider-label">Brightness</span>
                    <span id="filter-value" class="slider-value">100%</span>
                </div>
                <input type="range" id="filter-slider" min="0" max="200" value="100" step="3">
            </div>

            <!-- Rotate & Flip Section -->
            <div class="rotate-section">
                <label class="section-title">Rotate &amp; Flip</label>

                <!-- Rotate Slider (continuous rotation in degrees) -->
                <div class="slider-wrapper">
                    <div class="slider-header">
                        <span class="slider-label">Rotate</span>
                        <span id="rotate-value" class="slider-value">0&deg;</span>
                    </div>
                    <input type="range" id="rotate-slider" min="0" max="360" value="0" step="3">
                </div>

                <!-- Rotate & Flip Buttons -->
                <div class="rotate-buttons">
                    <button id="rotate-left" class="rotate-btn" title="Rotate Left 90°">&#8634;</button>
                    <button id="rotate-right" class="rotate-btn" title="Rotate Right 90°">&#8635;</button>
                    <button id="flip-h" class="rotate-btn" title="Flip Horizontal">&#8646;</button>
                    <button id="flip-v" class="rotate-btn" title="Flip Vertical">&#8645;</button>
                </div>
            </div>

            <!-- Reset Filters Button -->
            <button id="reset-btn" class="reset-btn">RESET FILTERS</button>

            <!-- ===== History Panel (Part B) ===== -->
            <div class="history-section">
                <label class="section-title">History</label>
                <!-- Undo / Redo Buttons -->
                <div class="history-controls">
                    <button id="undo-btn" class="history-btn" disabled>&#8617; Undo</button>
                    <button id="redo-btn" class="history-btn" disabled>&#8618; Redo</button>
                </div>
                <!-- Scrollable History List -->
                <div id="history-list" class="history-list">
                    <!-- History entries are dynamically generated by JS -->
                </div>
            </div>

        </div>
        <!-- END Editor Panel -->

        <!-- ===== RIGHT PANEL: Image Preview ===== -->
        <div class="preview-panel">

            <!-- Image Display Area -->
            <div class="image-container" id="image-container">
                <img id="preview-img" alt="No image selected">
                <span id="placeholder-text" class="placeholder">Choose an image to start editing</span>
            </div>

            <!-- Choose Image / Save Image Buttons -->
            <div class="action-buttons">
                <input type="file" id="file-input" accept="image/*" hidden>
                <button id="choose-btn" class="action-btn">CHOOSE IMAGE</button>
                <button id="save-btn" class="action-btn">SAVE IMAGE</button>
            </div>

        </div>
        <!-- END Preview Panel -->

    </div>
    <!-- END Container -->

    <!-- Application JavaScript -->
    <script src="script.js"></script>
</body>
</html>
